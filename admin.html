<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GÓC KHUẤT - Admin Center</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <style>
        /* Hiệu ứng nền lưới Cyberpunk mờ ảo */
        .cyber-grid {
            background-size: 40px 40px;
            background-image: linear-gradient(to right, rgba(14, 165, 233, 0.05) 1px, transparent 1px),
                              linear-gradient(to bottom, rgba(14, 165, 233, 0.05) 1px, transparent 1px);
            animation: gridMove 20s linear infinite;
        }
        @keyframes gridMove {
            0% { transform: translateY(0); }
            100% { transform: translateY(40px); }
        }
        
        /* Hiệu ứng nhấp nháy mềm mại (không bị ẩn hoàn toàn) */
        .pulse-soft {
            animation: pulseSoft 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @keyframes pulseSoft {
            0%, 100% { opacity: 1; box-shadow: 0 0 15px rgba(225,29,72,0.4); }
            50% { opacity: 0.8; box-shadow: 0 0 5px rgba(225,29,72,0.1); }
        }

        /* Hiệu ứng thanh cuộn Neon */
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.5); border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(14, 165, 233, 0.5); border-radius: 10px; box-shadow: inset 0 0 6px rgba(0,0,0,0.3); }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: rgba(14, 165, 233, 0.8); }
        
        /* Hiệu ứng xuất hiện mượt mà cho các thẻ Học sinh */
        .card-enter { animation: fadeInUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; opacity: 0; }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(15px) scale(0.95); } to { opacity: 1; transform: translateY(0) scale(1); } }
    </style>
</head>
<body class="bg-slate-950 text-white font-sans h-[100dvh] flex flex-col overflow-hidden relative">
    
    <!-- Lớp nền Lưới 3D -->
    <div class="absolute inset-0 cyber-grid z-0 pointer-events-none origin-bottom scale-110"></div>
    <!-- Quầng sáng trung tâm -->
    <div class="absolute top-[-20%] left-1/2 -translate-x-1/2 w-[800px] h-[500px] bg-sky-900/20 blur-[120px] rounded-full z-0 pointer-events-none"></div>

    <!-- HEADER ADMIN TỐI ƯU KÍNH MỜ (ĐÃ SỬA RESPONSIVE PC/MOBILE) -->
    <header class="relative z-10 bg-slate-950/80 backdrop-blur-xl border-b border-sky-900/50 p-3 lg:p-4 shrink-0 flex flex-col lg:flex-row justify-between items-start lg:items-center gap-4 lg:gap-6 shadow-[0_4px_30px_rgba(0,0,0,0.5)]">
        <div class="flex flex-col sm:flex-row items-start sm:items-center gap-3 lg:gap-6 w-full lg:w-auto">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-amber-400 to-orange-600 flex items-center justify-center shadow-[0_0_20px_rgba(245,158,11,0.4)] shrink-0">
                    <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path></svg>
                </div>
                <div>
                    <h1 class="text-lg lg:text-xl font-black text-transparent bg-clip-text bg-gradient-to-r from-amber-400 to-yellow-200 tracking-[0.15em] lg:tracking-[0.2em] leading-tight drop-shadow-md">TỔNG ĐÀI GIÁM SÁT</h1>
                    <div class="flex items-center gap-2 mt-1">
                        <span class="relative flex h-2 w-2"><span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span><span class="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span></span>
                        <p class="text-[10px] lg:text-xs text-emerald-400/80 font-mono tracking-widest">LIVE TRACKING ACTIVE</p>
                    </div>
                </div>
            </div>
            
            <div class="h-10 w-px bg-slate-800 hidden lg:block"></div>
            
            <div class="flex w-full sm:w-auto items-center gap-2 lg:gap-3">
                <button onclick="createNewRoom()" class="group relative flex-1 sm:flex-none px-4 py-2 bg-slate-800 hover:bg-sky-600 text-sky-400 hover:text-white rounded-lg text-sm font-black transition-all duration-300 border border-sky-500/30 hover:border-sky-400 shadow-[0_0_10px_rgba(14,165,233,0.1)] hover:shadow-[0_0_20px_rgba(14,165,233,0.5)] overflow-hidden">
                    <span class="relative z-10 whitespace-nowrap">TẠO PHÒNG MỚI</span>
                    <div class="absolute inset-0 bg-gradient-to-r from-sky-400/0 via-sky-400/30 to-sky-400/0 translate-x-[-100%] group-hover:translate-x-[100%] transition-transform duration-700"></div>
                </button>
                <div id="room-code-display" class="hidden flex-1 sm:flex-none items-center justify-center gap-2 lg:gap-3 bg-slate-900/80 px-4 py-1.5 rounded-lg border border-sky-500/40 shadow-inner">
                    <span class="text-[10px] lg:text-xs text-slate-500 font-bold uppercase tracking-widest">ID:</span>
                    <span id="current-room-text" class="text-xl lg:text-2xl font-black text-white tracking-[0.2em] lg:tracking-[0.25em] drop-shadow-[0_0_8px_rgba(255,255,255,0.5)]">---</span>
                </div>
            </div>
        </div>

        <div class="grid grid-cols-2 lg:flex gap-3 w-full lg:w-auto">
            <button onclick="closeSession()" class="w-full lg:w-auto px-4 py-2 bg-rose-950/40 hover:bg-rose-600 text-rose-400 hover:text-white rounded-lg text-sm font-bold transition-all duration-300 border border-rose-900 hover:border-rose-500 shadow-[0_0_10px_rgba(225,29,72,0.1)] hover:shadow-[0_0_20px_rgba(225,29,72,0.4)] flex items-center justify-center gap-2 whitespace-nowrap">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg> Đóng phòng
            </button>
            <button onclick="exportExcel()" class="w-full lg:w-auto px-4 py-2 bg-emerald-950/40 hover:bg-emerald-500 text-emerald-400 hover:text-white rounded-lg text-sm font-bold transition-all duration-300 border border-emerald-900 hover:border-emerald-400 shadow-[0_0_10px_rgba(16,185,129,0.1)] hover:shadow-[0_0_20px_rgba(16,185,129,0.4)] flex items-center justify-center gap-2 whitespace-nowrap">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg> Xuất Báo Cáo
            </button>
        </div>
    </header>

    <main class="relative z-10 flex-1 flex flex-col min-h-0 p-3 sm:p-4 gap-4 sm:gap-5 overflow-hidden">
        
        <!-- KHU VỰC 1: ĐƯỜNG ĐUA CHI TIẾT (GHIM) -->
        <section class="bg-slate-900/40 backdrop-blur-md border border-slate-700/50 rounded-2xl p-4 sm:p-5 shrink-0 shadow-[0_8px_30px_rgba(0,0,0,0.4)]">
            <h2 class="text-xs sm:text-sm font-bold text-amber-500/80 mb-4 uppercase tracking-[0.2em] flex items-center gap-3">
                <div class="p-1.5 bg-amber-500/20 rounded-md border border-amber-500/30"><svg class="w-4 h-4 text-amber-400" fill="currentColor" viewBox="0 0 24 24"><path d="M16 11V5.5C16 3.57 14.43 2 12.5 2S9 3.57 9 5.5V11L7 15v2h4.5v5l1 2 1-2v-5H18v-2l-2-4zm-4-7.5c.83 0 1.5.67 1.5 1.5V11h-3V5.5c0-.83.67-1.5 1.5-1.5z"/></svg></div>
                Mục Tiêu Theo Dõi Chuyên Sâu
            </h2>
            <div id="pinned-players-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 min-h-[90px] sm:min-h-[110px] transition-all">
                <div class="col-span-full flex flex-col items-center justify-center p-4 border border-dashed border-slate-700/50 rounded-xl bg-slate-900/20">
                    <p class="text-slate-500 text-sm font-mono tracking-wider">CHƯA CÓ MỤC TIÊU ĐƯỢC CHỈ ĐỊNH</p>
                </div>
            </div>
        </section>

        <!-- KHU VỰC 2: DANH SÁCH TỔNG -->
        <section class="flex-1 min-h-0 flex flex-col bg-slate-900/40 backdrop-blur-md border border-slate-700/50 rounded-2xl p-4 sm:p-5 shadow-[0_8px_30px_rgba(0,0,0,0.4)]">
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-4 gap-4 border-b border-slate-800 pb-4">
                <div class="flex items-center gap-3">
                    <div class="p-1.5 bg-sky-500/20 rounded-md border border-sky-500/30"><svg class="w-4 h-4 text-sky-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path></svg></div>
                    <h2 class="text-xs sm:text-sm font-bold text-sky-400/80 uppercase tracking-[0.2em]">
                        Tổng Quan Mạng Lưới (<span id="total-players-count" class="text-white font-black text-lg">0</span>/30)
                    </h2>
                </div>
                
                <div class="flex flex-wrap gap-2 bg-slate-950/80 p-1.5 rounded-xl border border-slate-700/50 shadow-inner w-full sm:w-auto">
                    <button onclick="setFilter('ALL')" id="filter-ALL" class="flex-1 sm:flex-none px-4 py-1.5 text-xs font-bold rounded-lg bg-sky-600 text-white shadow-[0_0_10px_rgba(14,165,233,0.5)] transition-all">TẤT CẢ</button>
                    <button onclick="setFilter('PLAYING')" id="filter-PLAYING" class="flex-1 sm:flex-none px-4 py-1.5 text-xs font-bold rounded-lg text-slate-400 hover:text-sky-300 hover:bg-slate-800 transition-all">ĐANG XỬ LÝ</button>
                    <button onclick="setFilter('FINISHED')" id="filter-FINISHED" class="flex-1 sm:flex-none px-4 py-1.5 text-xs font-bold rounded-lg text-slate-400 hover:text-emerald-300 hover:bg-slate-800 transition-all">HOÀN TẤT</button>
                </div>
            </div>
            
            <div class="flex-1 overflow-y-auto pr-2 custom-scrollbar">
                <div id="all-players-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4 pb-10">
                    <!-- Thẻ thông tin học sinh -->
                </div>
            </div>
        </section>
    </main>

    <!-- KẾT NỐI FIREBASE CHO ADMIN -->

            databaseURL: "https://goc-khuat-playtest-default-rtdb.asia-southeast1.firebasedatabase.app",

    </script>
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
    <script src="js/admin.js?v=8"></script>
</body>
</html>
